<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#234d3d">
  <meta name="description" content="简单报价：为小生意，做好每一份报价。客户、中文报价单与跟进，一处完成。">
  <title>简单报价 · 商家工作台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#quotes"><span class="brand-mark">简</span><span>简单报价<small>让好生意，从报价开始</small></span></a>
      <div class="nav-label">商家工作台</div>
      <nav aria-label="主导航">
        <a href="#quotes" data-nav="quotes"><span data-icon="file"></span><span>报价单</span><span class="nav-dot"></span></a>
        <a href="#customers" data-nav="customers"><span data-icon="users"></span><span>客户</span></a>
        <a href="#followups" data-nav="followups"><span data-icon="calendar"></span><span>跟进</span></a>
        <a href="#settings" data-nav="settings"><span data-icon="settings"></span><span>商家设置</span></a>
      </nav>
      <div class="sidebar-note"><span class="tiny-leaf">✳</span><strong>每份报价，都有回响。</strong><p>把时间留给客户，<br>把琐事交给简单报价。</p><span class="version">单商家版 / V1.0</span></div>
      <div class="sidebar-footer"><span class="status-dot"></span> 数据保存在本机服务端</div>

      <footer class="page-footer"><span>简单报价 · 认真对待每一笔生意</span><span>金额单位：人民币 CNY</span></footer>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
